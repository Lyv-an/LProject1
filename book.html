	<section class="booking-section">

      <div class="col-lg-8">
		  
	<form id="bookingForm">

<div class="row">

    <div class="col-md-6 mb-3">
        <input type="text"
               class="form-control"
               placeholder="Full Name"
               required>
    </div>

    <div class="col-md-6 mb-3">
        <input type="email"
               class="form-control"
               placeholder="Email Address"
               required>
    </div>

</div>

<input type="tel"
class="form-control mb-3"
placeholder="Phone Number" required>

<input id="checkin"
       type="date"
       class="form-control mb-3"
       required>

<input id="checkout"
       type="date"
       class="form-control mb-3"
       required>


<select class="form-select mb-3">
<option>Deluxe Ocean Villa</option>
<option>Beachfront Suite</option>
<option>Presidential Water Villa</option>
<option>Family Residence</option>
</select>

<textarea id="special"
class="form-control"
maxlength="300">
</textarea>

<div id="counter">0/300</div>

<button class="btn btn-warning mt-3">
Submit Booking
</button>
